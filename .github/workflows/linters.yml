name: Linters

on: [push, pull_request]

jobs:
  linters:
    name: Golang-CI (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: false
          args: --timeout=10m --build-tags=race ./...
