services:
  rabbitmq_readonly:
    build:
      context: ./rabbitmq-readonly
    ports:
      - "127.0.0.1:5675:5672"
      - "127.0.0.1:15675:15672"
    healthcheck:
      # Wait for the definitions import to create the test queue.
      # https://www.rabbitmq.com/docs/3.13/definitions#import-on-boot
      test: ["CMD-SHELL", "rabbitmqctl list_queues --no-table-headers | grep -q rr-readonly-queue"]
      interval: 3s
      timeout: 10s
      retries: 40
