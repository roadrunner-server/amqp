version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php php_test_files/jobs/jobs_ok_slow.php"
  relay: "pipes"
  relay_timeout: "20s"

amqp:
  rabbitmq:
    addr: amqp://guest:guest@127.0.0.1:5673/

logs:
  level: debug
  encoding: console
  mode: development

metrics:
  address: 127.0.0.1:2112

jobs:
  num_pollers: 10
  pipeline_size: 100000
  timeout: 10
  pool:
    num_workers: 10
    allocate_timeout: 120s
    destroy_timeout: 1s

  pipelines:
    test-1:
      driver: amqp
      config:
        connection: rabbitmq
        prefetch: 100
        priority: 1
        exchange:
          name: default
          type: direct
        queue:
          name: test-1-queue
          routing_key: test-1
          exclusive: false
          delete_on_stop: true
          multiple_ack: false
          requeue_on_fail: false

  consume: [ "test-1" ]
