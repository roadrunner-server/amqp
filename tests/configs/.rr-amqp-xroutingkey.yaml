version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php php_test_files/jobs/jobs_ok.php"
  relay: "pipes"
  relay_timeout: "20s"

amqp:
  rabbitmq:
    addr: amqp://guest:guest@127.0.0.1:5672/

logs:
  level: debug
  encoding: console
  mode: development

jobs:
  pipeline_size: 100000
  pool:
    num_workers: 2
    allocate_timeout: 60s
    destroy_timeout: 1s

  pipelines:
    test-1:
      driver: amqp
      config:
        connection: rabbitmq
        prefetch: 100
        priority: 1
        exchange:
          name: default
          type: direct
        queue:
          name: test-1-rk1
          routing_key: x-routing-key
          delete_on_stop: true
    test-2:
      driver: amqp
      config:
        connection: rabbitmq
        prefetch: 100
        priority: 1
        exchange:
          name: default
          type: direct
        queue:
          name: test-1-rk2
          routing_key: super-routing-key
          delete_on_stop: true

  consume: [ "test-2" ]
