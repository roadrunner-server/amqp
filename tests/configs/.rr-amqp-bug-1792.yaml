version: '3'

rpc:
  listen: tcp://127.0.0.1:1792

server:
  command: "php php_test_files/jobs/jobs_ok.php"
  relay: "pipes"
  relay_timeout: "20s"

amqp:
  rabbitmq:
    addr: amqp://guest:guest@127.0.0.1:5672/

logs:
  level: debug
  encoding: console
  mode: development

jobs:
  num_pollers: 1
  pipeline_size: 100000
  timeout: 1
  pool:
    num_workers: 10
    allocate_timeout: 60s
    destroy_timeout: 1s

  pipelines:
    queue1:
      driver: amqp
      config:
        connection: rabbitmq
        exchange:
          name: amqp.direct
          type: direct
          durable: true
        queue:
          name: queue1
          routing_key: queue1
          durable: true
    queue2:
      driver: amqp
      config:
        connection: rabbitmq
        exchange:
          name: amqp.direct
          type: direct
          durable: true
        queue:
          name: queue2
          routing_key: queue2
          durable: true
