version: '3'

rpc:
  listen: tcp://127.0.0.1:6100

server:
  command: "php php_test_files/jobs/jobs_ok.php"
  relay: "pipes"
  relay_timeout: "20s"

amqp:
  rabbitmq:
    addr: amqp://guest:guest@127.0.0.1:5672/

logs:
  level: error
  encoding: console
  mode: development

jobs:
  num_pollers: 5
  pipeline_size: 100000
  pool:
    num_workers: 10
    allocate_timeout: 60s
    destroy_timeout: 1s

  pipelines:
    test-1:
      driver: amqp
      config:
        connection: rabbitmq
        prefetch: 100
        priority: 1
        exchange:
          name: default
          type: direct
        queue:
          name: test-1-otel
          routing_key: test-1-otel
          durable: true
          delete_on_stop: true

  consume: [ "test-1" ]
